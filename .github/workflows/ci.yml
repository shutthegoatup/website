name: CI

# Mirrors renderappio/website's ci.yml, minus its unit/e2e jobs: this repo has
# no test suite yet, so those jobs would reference scripts that do not exist.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 rather than renderappio/website's 20: eslint-plugin-astro
      # declares engines >=22.22, which 20 does not satisfy.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # Content collections generate .astro/types.d.ts, and the type-aware
      # eslint rules need it to resolve astro:content. Without this, lint sees
      # every collection entry as an error type and fails. The deploy pipeline
      # avoids it by accident: `validate` runs typecheck, which syncs, first.
      - name: Generate content types
        run: npx astro sync

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/
          retention-days: 7
