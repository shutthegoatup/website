name: Build and Deploy

# Reusable: callers pass the target bucket, domain and role. Mirrors the
# renderappio/website pipeline (build -> OIDC -> s3 sync -> invalidate).

on:
  workflow_call:
    inputs:
      s3_bucket:
        description: "S3 origin bucket to publish to. Built by the website module as <domain-with-dashes>-site-<account>-<region>-an, so it is not the domain name."
        required: true
        type: string
      site_domain:
        description: "Hostname this environment serves. Used to find the CloudFront distribution by its alias, so no distribution id has to be pasted in after every apply."
        required: true
        type: string
      aws_role:
        description: "ARN of the OIDC role to assume. Production and preview live in separate accounts, so each caller supplies its own."
        required: true
        type: string
      environment:
        description: "Environment name for display"
        required: false
        type: string
        default: "Preview"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2

jobs:
  build-and-deploy:
    name: "Build & Deploy: ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 clears eslint-plugin-astro's engines >=22.22 requirement.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # Gate the deploy: astro check + eslint + prettier must pass before
      # anything reaches a bucket.
      - name: Validate
        run: npm run validate

      # The site marks itself noindex unless this matches the production
      # domain, so a preview environment can never be indexed by omission.
      - name: Build
        env:
          PUBLIC_SITE_DOMAIN: ${{ inputs.site_domain }}
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role }}
          aws-region: ${{ env.AWS_REGION }}

      # Resolved rather than hardcoded: the id is only known after the
      # workload root applies, and it changes if the distribution is ever
      # replaced. The deploy role grants cloudfront:ListDistributions for this.
      # Publishing the build is just an S3 sync and does not depend on
      # CloudFront existing, so it runs first and is what decides success.
      - name: Deploy to S3
        env:
          BUCKET: ${{ inputs.s3_bucket }}
        run: aws s3 sync ./dist "s3://${BUCKET}" --delete

      # Resolved rather than hardcoded: the id is only known after the workload
      # root applies, and it changes if the distribution is ever replaced. The
      # deploy role grants cloudfront:ListDistributions for this.
      #
      # Not fatal when nothing matches: until the ACM certificate validates
      # there is no distribution at all, and the build is still worth
      # publishing -- there is simply no cache to invalidate yet.
      - name: Resolve CloudFront distribution
        id: cf
        env:
          SITE_DOMAIN: ${{ inputs.site_domain }}
        run: |
          set -euo pipefail
          id=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, '${SITE_DOMAIN}')].Id | [0]" \
            --output text 2>/dev/null || echo "None")
          if [ -z "$id" ] || [ "$id" = "None" ]; then
            echo "::notice::No CloudFront distribution serves ${SITE_DOMAIN} yet - skipping invalidation. Content is published to S3."
            echo "id=" >> "$GITHUB_OUTPUT"
          else
            echo "id=$id" >> "$GITHUB_OUTPUT"
            echo "Resolved ${SITE_DOMAIN} -> $id"
          fi

      - name: Invalidate CloudFront
        if: steps.cf.outputs.id != ''
        env:
          DIST_ID: ${{ steps.cf.outputs.id }}
        run: aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
