name: Production | master

# NOTE: this repo's default branch is `master`, not `main`. The matching OIDC
# trust condition on the deploy role must therefore be
# `repo:shutthegoatup/website:ref:refs/heads/master`.

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Skips until the AWS workload accounts exist and these repo variables
    # are set, so the workflow can land before the infrastructure does
    # without failing every run in the meantime.
    if: vars.AWS_DEPLOY_ROLE != '' && vars.CLOUDFRONT_DISTRIBUTION_ID != ''
    uses: ./.github/workflows/deploy.yaml
    with:
      s3_bucket: "shutthegoatup.com"
      cloudfront_distribution_id: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      aws_role: ${{ vars.AWS_DEPLOY_ROLE }}
      environment: "Production"
