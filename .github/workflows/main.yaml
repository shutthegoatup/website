name: Production | master

# NOTE: this repo's default branch is `master`, not `main`. The deploy role's
# OIDC trust is scoped to repo:shutthegoatup/website:ref:refs/heads/master to
# match (terraform/05_workloads/stgu-website in renderappio/aws-org-management).

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yaml
    with:
      # Bucket name is built by the website module, not the domain itself.
      s3_bucket: "shutthegoatup-com-site-488658242048-eu-west-2-an"
      site_domain: "shutthegoatup.com"
      aws_role: "arn:aws:iam::488658242048:role/gha-website-deployer"
      environment: "Production"
