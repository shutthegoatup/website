name: Preview | PR

# Deploys to the stgu-website-notprod account. Its deploy role trusts the
# pull_request event only, so this cannot publish to production.

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yaml
    with:
      # Bucket name is built by the website module, not the domain itself.
      s3_bucket: "unstable-shutthegoatup-com-site-784620264214-eu-west-2-an"
      site_domain: "unstable.shutthegoatup.com"
      aws_role: "arn:aws:iam::784620264214:role/gha-website-deployer"
      environment: "Preview"
