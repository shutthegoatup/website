server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro emits /page/index.html; serve those without a trailing-slash redirect.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Content-hashed assets are safe to cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Carried over from the Cloudflare Pages _headers file, which does not apply
    # on S3/CloudFront. The CloudFront path needs the equivalent as a response
    # headers policy in the website workload root.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
